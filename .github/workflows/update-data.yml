# Pulls new scores, schedules and official playoff points from MHSAA and commits
# any changes, which makes Streamlit Cloud redeploy the app with fresh data.
name: Update game data

on:
  schedule:
    # Four times a day (UTC) from August through December
    - cron: "0 5,11,17,23 * 8-12 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy

      - name: Fetch games from the MHSAA Score Center
        run: python fetch_games.py

      - name: Refresh official playoff points
        run: python refresh_mhsaa.py

      - name: Update season-by-season accuracy
        run: python backtest.py --save

      - name: Commit changes
        run: |
          if git status --porcelain -- 'games_*.csv' 'mhsaa_*.csv' backtest_summary.csv | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add games_*.csv mhsaa_*.csv backtest_summary.csv
            git commit -m "Update game data from MHSAA ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes"
          fi
